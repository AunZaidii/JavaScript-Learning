<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./script.js"></script>
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form>
        <span>height in CM: </span> 
        <span><input type="text" name="height" id="height"></span>
        <span><br><br>weight in KG:</span> 
        <span><input type="text" name="weight" id="weight"></span>
        <button id="calculate">Calculate</button>
        <div id="result"></div>
    </form>
    <h2>BMI Weight Guide</h2>
    <p>Underweight: less than 18.6</p>
    <p>Normal range: 18.6-24.9</p>
    <p>Overweight: greater than 24.9</p>
</body>
</html>
